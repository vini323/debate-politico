{% extends "base.html" %}
{% block titulo %}Confirmar exclusão{% endblock %}
{% block conteudo %}
<div class="card form">
  <h1>Excluir “{{ object }}”?</h1>
  <p>Essa ação não pode ser desfeita.{% if object.propostas %} Todas as propostas deste candidato também serão apagadas.{% endif %}</p>
  <form method="post">
    {% csrf_token %}
    <div class="acoes">
      <button class="btn btn-perigo" type="submit">Sim, excluir</button>
      <a href="{{ object.get_absolute_url }}">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
