{% for campo in form %}
  <div class="campo{% if campo.errors %} campo-erro{% endif %}{% if campo.field.widget.input_type == 'checkbox' %} campo-check{% endif %}">
    <label for="{{ campo.id_for_label }}">{{ campo.label }}</label>
    {{ campo }}
    {% if campo.help_text %}<small>{{ campo.help_text }}</small>{% endif %}
    {% for erro in campo.errors %}<small class="erro">{{ erro }}</small>{% endfor %}
  </div>
{% endfor %}
{% for erro in form.non_field_errors %}<div class="alerta alerta-error">{{ erro }}</div>{% endfor %}
