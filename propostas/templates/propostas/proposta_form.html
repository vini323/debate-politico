{% extends "base.html" %}
{% block titulo %}{% if object %}Editar proposta{% else %}Nova proposta{% endif %}{% endblock %}
{% block conteudo %}
<h1>{% if object %}Editar proposta{% else %}Nova proposta{% endif %}</h1>
<form method="post" class="card form">
  {% csrf_token %}
  {% include "propostas/_campos.html" %}
  <div class="acoes">
    <button class="btn" type="submit">Salvar</button>
    <a href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'propostas:proposta_lista' %}{% endif %}">Cancelar</a>
  </div>
</form>
{% endblock %}
