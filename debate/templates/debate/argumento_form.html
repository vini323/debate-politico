{% extends "base.html" %}
{% block titulo %}{% if object %}Editar argumento{% else %}Novo argumento{% endif %}{% endblock %}
{% block conteudo %}
<h1>{% if object %}Editar argumento{% else %}Novo argumento{% endif %}</h1>
<form method="post" class="card form">
  {% csrf_token %}
  {% include "debate/_campos.html" %}
  <div class="acoes">
    <button class="btn" type="submit">{% if object %}Salvar alterações{% else %}Publicar argumento{% endif %}</button>
    <a href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'debate:argumento_lista' %}{% endif %}">Cancelar</a>
  </div>
</form>
{% endblock %}
