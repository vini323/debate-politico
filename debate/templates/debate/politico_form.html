{% extends "base.html" %}
{% block titulo %}{% if object %}Editar político{% else %}Novo político{% endif %}{% endblock %}
{% block conteudo %}
<h1>{% if object %}Editar {{ object.nome }}{% else %}Novo político{% endif %}</h1>
<form method="post" class="card form">
  {% csrf_token %}
  {% include "debate/_campos.html" %}
  <div class="acoes">
    <button class="btn" type="submit">Salvar</button>
    <a href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'debate:politico_lista' %}{% endif %}">Cancelar</a>
  </div>
</form>
{% endblock %}
