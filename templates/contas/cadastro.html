{% extends "base.html" %}
{% block titulo %}Cadastro{% endblock %}
{% block conteudo %}
<div class="auth">
  <div class="card auth-card">
    <h1>Criar conta</h1>
    <p class="sub">Leva menos de um minuto.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "propostas/_campos.html" %}
      <button class="btn btn-largo" type="submit">Criar minha conta</button>
    </form>
    <p class="auth-rodape">Já tem conta? <a href="{% url 'contas:login' %}">Entrar</a></p>
  </div>
</div>
{% endblock %}
