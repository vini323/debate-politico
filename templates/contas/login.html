{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo %}
<div class="auth">
  <div class="card auth-card">
    <h1>Entrar</h1>
    <p class="sub">Entre na sua conta para ver as propostas dos candidatos.</p>
    <form method="post">
      {% csrf_token %}
      {% include "propostas/_campos.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <p class="esqueci"><a href="{% url 'contas:esqueci_senha' %}">Esqueci minha senha</a></p>
      <button class="btn btn-largo" type="submit">Entrar</button>
    </form>
    <p class="auth-rodape">Ainda não tem conta? <a href="{% url 'contas:cadastro' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Cadastre-se</a></p>
  </div>
</div>
{% endblock %}
