{% extends "base.html" %}
{% block titulo %}Trocar senha{% endblock %}
{% block conteudo %}
<div class="auth">
  <div class="card auth-card">
    <h1>Trocar senha</h1>
    <form method="post">
      {% csrf_token %}
      {% include "propostas/_campos.html" %}
      <button class="btn btn-largo" type="submit">Salvar nova senha</button>
    </form>
    <p class="auth-rodape"><a href="{% url 'contas:meus_dados' %}">← Voltar para meus dados</a></p>
  </div>
</div>
{% endblock %}
